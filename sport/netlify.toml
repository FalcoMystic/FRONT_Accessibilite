[build]
  command = "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader && npm install --no-audit --no-fund && npm run build && php artisan site:export"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  PHP_VERSION = "8.3"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
